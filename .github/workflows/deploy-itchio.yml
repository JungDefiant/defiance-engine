# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Itch

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "itch"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-itchio
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: lts/*
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Zip dist folder
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -r build.zip dist
      - name: Setup butler
        uses: remarkablegames/setup-butler@v2
      - name: Upload to itch.io
        run: butler push build.zip ${{ secrets.ITCH_USER_NAME }}/${{secrets.ITCH_GAME}}:html5
        env:
          BUTLER_API_KEY: ${{ secrets.API_KEY }}
